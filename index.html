<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paddy Field Data Collector</title>
  
  <!-- Leaflet.js (地図描画ライブラリ) CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f0f0f0;
      color: #111111;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .header {
      border-bottom: 2px solid #111111;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
      color: #111111;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 4px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      font-size: 0.85rem;
      font-weight: 700;
      display: block;
      margin-bottom: 6px;
      color: #222222;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #999999;
      border-radius: 4px;
      background: #ffffff;
      color: #111111;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #111111;
      box-shadow: 0 0 0 1px #111111;
    }
    input[type="file"] {
      width: 100%;
      font-size: 0.85rem;
      color: #333333;
    }
    #map {
      height: 220px;
      width: 100%;
      border: 1px solid #999999;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .coords-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8f8f8;
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .coords-val {
      font-family: monospace;
      font-weight: 600;
      color: #111111;
    }
    .btn-gps {
      background: #ffffff;
      border: 1px solid #666666;
      color: #111111;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-gps:active {
      background: #e0e0e0;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #111111;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .btn-submit:active {
      background-color: #333333;
    }
    .btn-submit:disabled {
      background-color: #888888;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      text-align: center;
      font-weight: 600;
    }
    .success { color: #111111; }
    .error { color: #666666; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Paddy Field Data Collector</h1>
    </div>

    <!-- 地図・位置情報設定 -->
    <div class="card">
      <label>位置情報（GPS自動取得）</label>
      <div id="map"></div>
      <div class="coords-wrapper">
        <div>
          <span>Lat: <span id="lat" class="coords-val">取得中...</span></span>
          <span style="margin-left: 8px;">Lng: <span id="lng" class="coords-val">取得中...</span></span>
        </div>
        <button type="button" class="btn-gps" onclick="getCurrentLocation()">現在地再取得</button>
      </div>
    </div>

    <!-- 圃場ID入力 -->
    <div class="card">
      <div class="form-group">
        <label for="fieldId">圃場ID</label>
        <input type="text" id="fieldId" placeholder="例: FIELD_A01" required>
      </div>
    </div>

    <!-- 画像選択エリア -->
    <div class="card">
      <div class="form-group">
        <label for="imgEar">1. 稲穂画像</label>
        <input type="file" id="imgEar" accept="image/*" capture="environment">
      </div>
      <div class="form-group">
        <label for="imgRoot">2. 根本画像</label>
        <input type="file" id="imgRoot" accept="image/*" capture="environment">
      </div>
      <div class="form-group">
        <label for="imgView">3. 圃場前景画像</label>
        <input type="file" id="imgView" accept="image/*" capture="environment">
      </div>
    </div>

    <!-- 送信ボタン -->
    <button id="sendBtn" class="btn-submit" onclick="sendData()">送信・登録</button>
    <div id="status" class="status-msg"></div>
  </div>

  <!-- Leaflet.js (地図描画ライブラリ) JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // =============================================================
    // ★ 設定項目（ご自身のGAS環境に合わせて書き換えてください）
    // =============================================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqVeq6e8UOXKfpIjgECy94BX3I-Q9i-WYHQG6fdGTYG2TNi8DM2XPPz6ussF7DCS5A/exec"; // デプロイして取得したGASのURL
    const SECRET_KEY = "tojormo";                  // GAS側で設定した SECRET_KEY

    let map, marker, selectedLat = null, selectedLng = null;

    // 1. 地図の初期化
    function initMap() {
      // 初期位置（位置情報取得前のデフォルト設定）
      const defaultLat = 35.681236;
      const defaultLng = 139.767125;

      map = L.map('map').setView([defaultLat, defaultLng], 15);

      // モノトーン風（CartoDB Positron）または標準OpenStreetMapタイル
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // マーカー設定
      marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

      // 手動ピン調整イベント
      map.on('click', (e) => {
        marker.setLatLng(e.latlng);
        updateCoords(e.latlng.lat, e.latlng.lng);
      });

      marker.on('dragend', () => {
        const pos = marker.getLatLng();
        updateCoords(pos.lat, pos.lng);
      });

      // アプリ起動時に現在地（GPS）を取得
      getCurrentLocation();
    }

    // GPSから現在地を取得・反映する機能
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        alert("お使いのブラウザは位置情報機能（GPS）に対応していません。");
        return;
      }

      document.getElementById('lat').innerText = "取得中...";
      document.getElementById('lng').innerText = "取得中...";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          map.setView([lat, lng], 17);
          marker.setLatLng([lat, lng]);
          updateCoords(lat, lng);
        },
        (err) => {
          console.warn("GPS取得失敗: ", err.message);
          alert("位置情報の取得に失敗しました。端末のGPS権限をオンにしてください。");
        },
        {
          enableHighAccuracy: true, // 高精度GPSモード
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 画面上の緯度経度数値を更新
    function updateCoords(lat, lng) {
      selectedLat = parseFloat(lat).toFixed(6);
      selectedLng = parseFloat(lng).toFixed(6);
      document.getElementById('lat').innerText = selectedLat;
      document.getElementById('lng').innerText = selectedLng;
    }

    // ファイルを Base64 文字列へ変換
    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      if (!file) return resolve("");
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = (error) => reject(error);
    });

    // 2. クラウド（GAS）へのデータ送信
    async function sendData() {
      const fieldId = document.getElementById('fieldId').value.trim();
      const fileEar = document.getElementById('imgEar').files[0];
      const fileRoot = document.getElementById('imgRoot').files[0];
      const fileView = document.getElementById('imgView').files[0];
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('sendBtn');

      statusDiv.className = "status-msg";
      statusDiv.innerText = "";

      // 入力チェック
      if (!selectedLat || !selectedLng) {
        alert("位置情報が取得できていません。「現在地再取得」を試してください。");
        return;
      }
      if (!fieldId) {
        alert("圃場IDを入力してください。");
        return;
      }
      if (!fileEar || !fileRoot || !fileView) {
        alert("3枚すべての画像を選択（撮影）してください。");
        return;
      }
      if (GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
        alert("GASのWeb App URLが設定されていません。");
        return;
      }

      btn.disabled = true;
      btn.innerText = "データ送信中...";

      try {
        const imgEarBase64 = await fileToBase64(fileEar);
        const imgRootBase64 = await fileToBase64(fileRoot);
        const imgViewBase64 = await fileToBase64(fileView);

        const payload = {
          secretKey: SECRET_KEY,
          fieldId: fieldId,
          lat: selectedLat,
          lng: selectedLng,
          imgEar: imgEarBase64,
          imgRoot: imgRootBase64,
          imgView: imgViewBase64
        };

        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        statusDiv.className = "status-msg success";
        statusDiv.innerText = "送信完了しました。";
        alert("正常に保存されました。");

        // 入力クリア
        document.getElementById('fieldId').value = "";
        document.getElementById('imgEar').value = "";
        document.getElementById('imgRoot').value = "";
        document.getElementById('imgView').value = "";

      } catch (err) {
        console.error("送信エラー:", err);
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "送信エラーが発生しました。";
        alert("送信に失敗しました: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "送信・登録";
      }
    }

    // 初期化実行
    window.onload = initMap;
  </script>
</body>
</html>
