<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrAInY | 圃場選択</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --ink: #1a1a1a; --muted: #8a8f98;
    --subtle: #f0f1f4; --accent: #111111; --danger: #c0392b;
    --radius: 14px; --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 6px 20px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }

  /* 地図：画面全体 */
  #map { position: fixed; inset: 0; width: 100%; height: 100dvh; z-index: 0; }

  /* ヘッダー：フローティング */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    background: rgba(255,255,255,0.82); backdrop-filter: blur(8px); box-shadow: 0 1px 8px rgba(0,0,0,0.08);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .site-logo img { display: block; width: auto; height: 34px; }
  .count-chip { font-size: 0.72rem; color: var(--muted); }
  .count-chip strong { color: var(--ink); font-weight: 700; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: none; color: #4a4f57;
    font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 7px 12px; border-radius: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .link-btn:active { opacity: 0.6; }
  .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
  .leaflet-top { top: 56px; }
  .leaflet-control-attribution { font-size: 10px; }

  /* 凡例：左下フローティング */
  .legend {
    position: fixed; left: 12px; bottom: 18px; z-index: 1000;
    display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: 60%;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
    padding: 10px 12px; border-radius: 12px; box-shadow: var(--shadow);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #4a4f57; }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 1px 2px rgba(0,0,0,0.15); }

  /* ホバー用ツールチップ */
  .leaflet-tooltip.field-tip {
    background: rgba(17,17,17,0.92); color: #fff; border: none; border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); padding: 8px 11px; font-size: 0.72rem; line-height: 1.5;
  }
  .leaflet-tooltip.field-tip::before { border-top-color: rgba(17,17,17,0.92); }
  .field-tip .t-name { font-weight: 700; font-size: 0.8rem; display: block; margin-bottom: 3px; }
  .field-tip .t-row { color: #d7dade; }
  .field-tip .t-row b { color: #fff; font-weight: 600; }

  /* 選択件数バー */
  .selbar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120%);
    z-index: 1100; display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(8px);
    padding: 10px 12px 10px 16px; border-radius: 40px; box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    transition: transform 0.25s ease; max-width: calc(100% - 24px);
  }
  .selbar.show { transform: translateX(-50%) translateY(0); }
  .selbar .sel-count { font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
  .selbar .sel-count span { color: var(--accent); }
  .selbar .btn-clear { background: var(--subtle); border: none; color: #4a4f57; font-size: 0.75rem; font-weight: 600; padding: 8px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
  .selbar .btn-send { background: var(--accent); border: none; color: #fff; font-size: 0.82rem; font-weight: 700; padding: 10px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
  .selbar .btn-send:active, .selbar .btn-clear:active { opacity: 0.75; }

  /* モーダル */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,22,26,0.5); z-index: 9999;
    justify-content: center; align-items: flex-end; backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--surface); border-radius: 18px 18px 0 0; max-width: 480px; width: 100%;
    padding: 20px 20px 26px; box-shadow: 0 -6px 30px rgba(0,0,0,0.25); max-height: 88vh; overflow-y: auto;
    animation: slideUp .22s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-title { font-size: 1.05rem; font-weight: 700; margin: 0; }
  .modal-close { background: var(--subtle); border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; }

  .sel-list { max-height: 40vh; overflow-y: auto; margin-bottom: 4px; }
  .sel-list-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--subtle); border-radius: 10px; padding: 9px 12px; margin-bottom: 7px; }
  .sel-list-item .sli-main { font-size: 0.82rem; font-weight: 700; }
  .sel-list-item .sli-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .sel-list-item .sli-del { background: transparent; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }

  label.lbl { display: block; font-size: 0.82rem; font-weight: 600; margin: 16px 0 7px; }
  input[type="password"] {
    width: 100%; padding: 12px 14px; font-size: 1rem; border: none; border-radius: 10px;
    background: var(--subtle); color: var(--ink);
  }
  input[type="password"]::placeholder { color: var(--muted); }
  input[type="password"]:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
  .btn-submit {
    width: 100%; margin-top: 18px; padding: 15px; background: var(--accent); color: #fff; border: none;
    border-radius: 12px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; box-shadow: var(--shadow);
  }
  .btn-submit:active { opacity: 0.8; }
  .btn-submit:disabled { background: var(--muted); cursor: not-allowed; box-shadow: none; }
  .status-msg { margin-top: 12px; font-size: 0.85rem; text-align: center; font-weight: 600; min-height: 18px; }
  .status-msg.success { color: var(--ink); }
  .status-msg.error { color: var(--danger); }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== 設定 ===== */
// GASをデプロイして取得した「ウェブアプリURL」に置き換えてください
const GAS_URL = "https://script.google.com/a/macros/tojormo.com/s/AKfycbzg85hsdx4gJoPgePLpe0Elf4URXjEr6qPyL9hWav6Ox4PO8r3xf4MeIx4WfSeh75QOig/exec";

/* ===== 地図 ===== */
const map = L.map('map').setView([34.899003, 135.058465], 16);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics' }).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' });
L.control.layers({ "衛星写真": sat, "標準地図": osm }, null, { position: 'topright' }).addTo(map);
window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 200));
window.addEventListener('resize', () => map.invalidateSize());

/* ===== 品種別の色分け ===== */
const VARIETY_COLORS = {
  "山田錦": "#e6194B", "山田錦(共生会)": "#f58231", "ヒノヒカリ": "#4363d8", "黒大豆": "#3cb44b"
};
const PALETTE = ["#911eb4","#42d4f4","#f032e6","#bfef45","#469990","#9A6324","#800000","#808000","#000075"];
let paletteIdx = 0;
const usedVarieties = new Map();
function colorFor(v){
  const key = (v == null || v === "") ? "未設定" : v;
  if (!(key in VARIETY_COLORS)){ VARIETY_COLORS[key] = PALETTE[paletteIdx % PALETTE.length] || "#8a8f98"; paletteIdx++; }
  usedVarieties.set(key, VARIETY_COLORS[key]);
  return VARIETY_COLORS[key];
}
const legend = document.getElementById('legend');
function buildLegend(){
  legend.innerHTML = "";
  usedVarieties.forEach((color, name) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<span class="legend-dot" style="background:'+color+'"></span>'+name;
    legend.appendChild(item);
  });
}

/* ===== 選択管理 ===== */
const markers = [];
const markerByNo = new Map();
const selectedMap = new Map();   // No -> field

function styleMarker(m){
  if (selectedMap.has(m.fieldData["No"])){
    m.setStyle({ weight: 4, radius: 11, color: "#111111", fillColor: colorFor(m.fieldData["作付計画_品種"]), fillOpacity: 1 });
  } else {
    m.setStyle({ weight: 2, radius: 8, color: "#ffffff", fillColor: colorFor(m.fieldData["作付計画_品種"]), fillOpacity: 0.9 });
  }
}
function tooltipHtml(f){
  return '<span class="t-name">'+(f["圃場名"] || "-")+'</span>' +
    '<div class="t-row"><b>ブロック:</b> '+(f["圃場ブロック"] || "-")+'</div>' +
    '<div class="t-row"><b>カテゴリ:</b> '+(f["圃場カテゴリ"] || "-")+'</div>' +
    '<div class="t-row"><b>担当者:</b> '+(f["担当者"] || "-")+'</div>' +
    '<div class="t-row"><b>品種:</b> '+(f["作付計画_品種"] || "-")+'</div>' +
    '<div class="t-row"><b>作付年:</b> '+(f["作付年"] ?? "-")+'</div>';
}

/* ===== データ読み込み（KSAS_field.json を参照） ===== */
fetch('KSAS_field.json', { cache: 'no-store' })
  .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
  .then(data => {
    const fields = data.filter(f => f.latitude != null && f.longitude != null);
    fields.forEach(f => {
      const m = L.circleMarker([f.latitude, f.longitude], {
        radius: 8, color: "#ffffff", weight: 2, fillColor: colorFor(f["作付計画_品種"]), fillOpacity: 0.9
      }).addTo(map);
      m.fieldData = f;
      m.bindTooltip(tooltipHtml(f), { className: 'field-tip', direction: 'top', offset: [0, -6], sticky: true });
      m.on('click', () => toggleField(m));
      markers.push(m);
      markerByNo.set(f["No"], m);
    });
    document.getElementById('fieldCount').textContent = fields.length;
    buildLegend();
    if (fields.length) map.fitBounds(L.latLngBounds(fields.map(f => [f.latitude, f.longitude])).pad(0.15));
  })
  .catch(err => {
    console.error('KSAS_field.json 読み込み失敗:', err);
    document.getElementById('fieldCount').textContent = '読込エラー';
    alert('圃場データ（KSAS_field.json）を読み込めませんでした。\nindex.html と同じフォルダに配置してください。\n\n詳細: ' + err.message);
  });

/* ===== 選択トグル ===== */
function toggleField(m){
  const no = m.fieldData["No"];
  if (selectedMap.has(no)) selectedMap.delete(no);
  else selectedMap.set(no, m.fieldData);
  styleMarker(m);
  updateSelbar();
}
function deselectByNo(no){
  selectedMap.delete(no);
  const m = markerByNo.get(no); if (m) styleMarker(m);
  updateSelbar(); renderSelList();
  if (selectedMap.size === 0) closePanel();
}
function clearSelection(){
  selectedMap.clear();
  markers.forEach(styleMarker);
  updateSelbar(); closePanel();
}
function updateSelbar(){
  const n = selectedMap.size;
  document.getElementById('selCount').textContent = n;
  document.getElementById('selbar').classList.toggle('show', n > 0);
}

/* ===== モーダル ===== */
function renderSelList(){
  const list = document.getElementById('selList');
  const items = [...selectedMap.values()];
  if (!items.length){ list.innerHTML = '<div style="font-size:0.8rem;color:var(--muted);padding:8px 2px;">選択されている圃場がありません。</div>'; return; }
  list.innerHTML = items.map(f =>
    '<div class="sel-list-item"><div>' +
      '<div class="sli-main">'+(f["圃場名"] || "-")+'</div>' +
      '<div class="sli-sub">'+(f["圃場カテゴリ"] || "-")+' / '+(f["作付計画_品種"] || "-")+' / '+(f["担当者"] || "-")+'</div>' +
    '</div><button class="sli-del" title="除外" onclick="deselectByNo('+JSON.stringify(f["No"])+')">&times;</button></div>'
  ).join('');
}
function openPanel(){
  if (selectedMap.size === 0) return;
  document.getElementById('panelTitle').textContent = "選択した圃場（" + selectedMap.size + "件）";
  renderSelList();
  const st = document.getElementById('status'); st.className='status-msg'; st.textContent="";
  document.getElementById('panel').classList.add('open');
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); }
document.getElementById('panel').addEventListener('click', function(e){ if (e.target === this) closePanel(); });

/* ===== 送信（圃場名＋パスワード） ===== */
async function sendData(){
  const pass = document.getElementById('pass').value.trim();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('sendBtn');

  if (selectedMap.size === 0){ statusEl.className='status-msg error'; statusEl.textContent='圃場が選択されていません'; return; }
  if (!pass){ statusEl.className='status-msg error'; statusEl.textContent='パスワードを入力してください'; return; }

  const records = [...selectedMap.values()].map(f => ({ "圃場名": f["圃場名"], "No": f["No"] }));
  const payload = { password: pass, records: records };

  btn.disabled = true;
  statusEl.className = 'status-msg';
  statusEl.textContent = records.length + '件を送信中...';

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.result === 'success'){
      statusEl.className = 'status-msg success';
      statusEl.textContent = 'OK ' + (data.count ?? records.length) + '件に印を付けました';
      document.getElementById('pass').value = '';
      setTimeout(() => { clearSelection(); }, 900);
    } else {
      statusEl.className = 'status-msg error';
      statusEl.textContent = (data.message || '送信に失敗しました');
    }
  } catch (e) {
    statusEl.className = 'status-msg error';
    statusEl.textContent = '通信エラー: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
