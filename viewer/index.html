<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>圃場写真ビューワー</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<header id="app-header">
  <h1>🌾 圃場写真ビューワー</h1>
  <nav id="menu-bar">
    <button class="menu-btn active" data-view="map">🗺️ 地図から見る</button>
    <button class="menu-btn" data-view="bytype">🏷️ 撮影種別から見る</button>
  </nav>
  <span id="status-text"></span>
</header>

<!-- ① 地図から見る -->
<section id="view-map" class="view active">
  <div id="map"></div>
</section>

<!-- ② 撮影種別から見る -->
<section id="view-bytype" class="view">
  <div id="bytype-toolbar">
    <label for="shottype-select">撮影種別:</label>
    <select id="shottype-select"></select>
    <span id="bytype-count"></span>
  </div>
  <div id="bytype-grid"></div>
</section>

<!-- ライトボックス(拡大表示) -->
<div id="lightbox" class="hidden">
  <button id="lightbox-close-btn">✕</button>
  <button id="lightbox-prev-btn">‹</button>
  <img id="lightbox-img" src="" alt="" />
  <button id="lightbox-next-btn">›</button>
  <div id="lightbox-caption"></div>
</div>

<div id="error-banner" class="hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
