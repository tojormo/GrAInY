<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>圃場写真マップ | GrAInY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* RMO Admin（Gantt / Accounting）と同じデザイン言語 */
:root{
  --ink:#0b2a5b; --ink2:#2b4a7a; --mute:#7a8fae; --hair:#dfe7f3; --hair2:#c3d2e8; --paper:#ffffff; --tint:#f2f6fc;
  --lv1:#1e4fa3; --lv2:#5b8bd6; --lv3:#b3cdf0; --accent:#e4002b;
  --font:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;letter-spacing:.01em;font-size:13px;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;cursor:pointer}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}

/* ===== ヘッダー ===== */
header.hd{flex:0 0 auto;display:flex;align-items:center;gap:20px;padding:10px 24px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--ink);z-index:600}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:26px;width:auto;display:block}
.brand .ttl{margin:0;font-size:15px;font-weight:900;line-height:1.2;white-space:nowrap}
.hd nav{display:flex;gap:22px;margin-left:auto;align-items:center}
.txtbtn{background:none;border:0;padding:8px 0;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--mute);position:relative;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.txtbtn small{font-size:9px;font-weight:600;letter-spacing:.22em}
.txtbtn::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;background:var(--ink);transition:right .25s}
.txtbtn:hover{color:var(--ink)}
.txtbtn:hover::after,.txtbtn.on::after{right:0}
.txtbtn.on{color:var(--ink)}

/* ===== 撮影日フィルタ ===== */
.fbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--paper);border-bottom:1px solid var(--hair2);z-index:550}
.fbar .lbl{flex:0 0 auto;line-height:1.25}
.fbar .lbl b{display:block;font-size:13px;font-weight:900;letter-spacing:.04em;color:var(--ink);text-transform:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 12px;border:1px solid var(--hair2);background:var(--paper);color:var(--ink2);font-size:13px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,color .15s;user-select:none}
.chip::before{content:"";width:12px;height:12px;border:1px solid var(--ink2);background:var(--paper);flex:0 0 auto}
.chip .w{font-size:11px;font-weight:500;color:var(--mute)}
.chip .n{font-size:11px;font-weight:600;color:var(--mute);font-feature-settings:"tnum";padding-left:7px;border-left:1px solid var(--hair2)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.on::before{background:var(--paper);box-shadow:inset 0 0 0 3px var(--ink);border-color:var(--paper)}
.chip.on .w,.chip.on .n{color:var(--lv3)}
.chip.on .n{border-left-color:var(--ink2)}
.chip:hover:not(.on){border-color:var(--ink);background:var(--tint)}
.chip.all::before{display:none}
.chip.radio::before{border-radius:50%}
.chip.radio.on::before{border-radius:50%}
.summary{flex:0 0 auto;text-align:right;font-size:11px;color:var(--mute);letter-spacing:.06em;line-height:1.4;white-space:nowrap}
.summary b{font-size:16px;font-weight:800;color:var(--ink);font-feature-settings:"tnum";letter-spacing:0}

/* ===== 画面本体 ===== */
.views{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}

/* ---- 地図 ---- */
#map{position:absolute;inset:0;background:var(--tint)}
#legend{position:absolute;left:12px;bottom:30px;z-index:400;max-width:78%;display:flex;flex-wrap:wrap;gap:6px 12px;background:rgba(255,255,255,.95);padding:9px 12px;border:1px solid var(--ink);border-top-width:3px;font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:500}
.legend-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--hair2);flex-shrink:0}
.legend-item.dim{color:var(--mute)}
.legend-item.dim .legend-dot{opacity:.35}
.leaflet-container{font-family:var(--font)}
.leaflet-popup-content-wrapper{border-radius:0;border:1px solid var(--ink);border-top-width:3px;box-shadow:0 10px 24px rgba(11,42,91,.18)}
.leaflet-popup-tip{box-shadow:none;border:1px solid var(--ink)}
.leaflet-popup-content{margin:12px 14px;color:var(--ink);font-size:12px;line-height:1.6}
.pop .t{font-size:15px;font-weight:900;margin:2px 0 6px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 8px}
.pop dt{color:var(--mute);font-size:10px;letter-spacing:.14em;align-self:center}
.pop dd{margin:0;font-weight:500}
.pop .dates{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.pill{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--hair2);color:var(--mute);font-feature-settings:"tnum"}
.pill.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;letter-spacing:.08em;box-shadow:0 2px 0 rgba(11,42,91,.18);transition:background .15s,transform .05s}
.btn:hover{background:var(--lv1);border-color:var(--lv1)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(11,42,91,.25)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:var(--tint)}
.pop .none{font-size:11px;color:var(--mute)}

/* ---- 一覧 ---- */
#listView{overflow-y:auto;background:var(--paper)}
.list-wrap{max-width:1180px;margin:0 auto;padding:20px 24px 72px}
.ctl{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ctl .chips{flex-wrap:wrap;overflow:visible}
section.dsec{border-top:1px solid var(--ink);padding:14px 0 26px}
.dsec-h{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px}
.dsec-h .d{font-size:20px;font-weight:900;line-height:1.1;letter-spacing:.01em}
.dsec-h .d small{font-size:12px;font-weight:700;color:var(--ink2);margin-left:4px}
.dsec-h .c{margin-left:auto;font-size:11px;color:var(--mute);letter-spacing:.08em;font-feature-settings:"tnum"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{position:relative;background:var(--paper);border:1px solid var(--hair2);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .2s;overflow:hidden}
.card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,42,91,.14)}
.card img{width:100%;height:130px;object-fit:cover;display:block;background:var(--tint)}
.card .info{padding:8px 10px 10px;border-top:3px solid var(--ink)}
.card .fn{font-size:14px;font-weight:900;line-height:1.3}
.card .meta{font-size:11px;color:var(--mute);margin-top:2px;letter-spacing:.02em}
.card .meta .ty{color:var(--ink2);font-weight:600}
.dbadge{position:absolute;top:0;left:0;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 7px;font-feature-settings:"tnum";pointer-events:none}
.empty{color:var(--mute);font-size:12px;padding:40px 0;text-align:center;border-top:1px solid var(--ink);letter-spacing:.04em}
/* 葉緑素診断は縦長写真で計測値が下寄りに写るため、サムネイルの切り出し位置を下げる */
img[data-type="Chlorophyll"]{object-position:center 78%}

/* ===== モーダル ===== */
.ov{display:none;position:fixed;inset:0;background:rgba(242,246,252,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:9000;justify-content:center;align-items:center;padding:16px}
.mcard{background:var(--paper);max-width:860px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--ink);border-top-width:4px;box-shadow:0 20px 48px rgba(11,42,91,.22)}
.mhead{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:flex-end;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--hair2)}
.mhead h2{margin:4px 0 0;font-size:20px;font-weight:900;line-height:1.2}
.mhead .sub{font-size:11px;color:var(--mute);margin-top:4px;letter-spacing:.04em}
.mhead .x{margin-left:auto}
.mbody{padding:4px 20px 22px}
.mbody section.dsec{padding:12px 0 18px}
.mbody section.dsec:first-child{border-top:0}
.mbody .dsec-h .d{font-size:16px}
.mbody .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mbody .card img{height:110px}
.mbody .card .info{padding:6px 8px 8px}
.mbody .card .fn{font-size:12px;font-weight:700}

/* ライトボックス */
#lightbox{background:rgba(8,20,44,.94);backdrop-filter:none;-webkit-backdrop-filter:none}
#lightbox .lb{max-width:94vw;width:100%;display:flex;flex-direction:column;align-items:center}
#lightboxImg{max-width:100%;max-height:72vh;object-fit:contain;display:block;background:#000}
.lb-cap{color:var(--paper);text-align:center;margin-top:12px;line-height:1.5}
.lb-cap .d{display:inline-block;background:var(--paper);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.06em;padding:3px 9px;margin-bottom:6px;font-feature-settings:"tnum"}
.lb-cap .f{font-size:16px;font-weight:900}
.lb-cap .ty{font-size:12px;color:var(--lv3);margin-left:8px;font-weight:600}
.lb-cap .cnt{display:block;font-size:10px;letter-spacing:.2em;color:var(--mute);margin-top:4px;font-feature-settings:"tnum"}
.lb-nav{display:flex;gap:10px;margin-top:12px}
.lb-nav .btn{background:transparent;border-color:var(--lv3);color:var(--paper);box-shadow:none;min-width:96px}
.lb-nav .btn:hover{background:var(--ink2)}

@media (max-width:640px){
  header.hd{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));gap:12px}
  .brand .ttl{display:none}
  .hd nav{gap:18px}
  .fbar{padding:8px 14px;gap:10px}
  .fbar .lbl{display:none}
  .fbar .chips{gap:6px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
  .fbar .chip{height:36px;padding:0 9px;gap:5px;font-size:12.5px}
  .fbar .chip .n{padding-left:5px}
  .summary{display:none}
  .list-wrap{padding:14px 14px 56px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card img{height:120px}
  .mhead{padding:14px 14px 10px}
  .mbody{padding:4px 14px 18px}
  .mbody .grid{grid-template-columns:repeat(2,1fr)}
  .ov{padding:8px}
}
</style>
</head>

    DEFAULT_LNG: 135.060832
  };

  // 撮影種別（入力アプリ index.html の IMAGE_FIELDS と同じ並び・表記）
  const TYPE_ORDER = ["Chlorophyll", "FieldHigh", "FieldLow", "Plant", "Base", "Ground"];
  const TYPE_LABELS = {
    Chlorophyll: "葉の葉緑素診断",
    FieldHigh: "圃場全体（高視点）",
    FieldLow: "圃場全体（低視点）",
    Plant: "稲株全体",
    Base: "株元",
    Ground: "地面"
  };
  const typeLabel = t => TYPE_LABELS[t] || t || '';
  const typeRank = t => { const i = TYPE_ORDER.indexOf(t); return i === -1 ? TYPE_ORDER.length : i; };

  const COLOR_PALETTE = [
    '#e6194B','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6',
    '#bfef45','#fabed4','#469990','#9A6324','#800000','#808000','#000075','#a9a9a9'
  ];
  const varietyColors = {};
  let colorIndex = 0;
  function colorForVariety(v) {
    const key = (v == null || v === "") ? "未設定" : v;
    if (!(key in varietyColors)) {
      varietyColors[key] = COLOR_PALETTE[colorIndex % COLOR_PALETTE.length];
      colorIndex++;
    }
    return varietyColors[key];
  }

  // -------------------------------------------------------------
  // 日付表示ユーティリティ
  // -------------------------------------------------------------
  const WEEK_JA = ['日','月','火','水','木','金','土'];
  const WEEK_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  let multiYear = false; // データに複数年が含まれるときは年も表示
  function parseYmd(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return { y: +m[1], mo: +m[2], d: +m[3], w: d.getDay() };
  }
  function fmtShort(ymd) {   // 10/04 または 2026/10/04
    const p = parseYmd(ymd); if (!p) return ymd || '日付不明';
    const md = String(p.mo).padStart(2, '0') + '/' + String(p.d).padStart(2, '0');
    return multiYear ? p.y + '/' + md : md;
  }
  function fmtLong(ymd) {    // 2026年10月4日（土）
    const p = parseYmd(ymd); if (!p) return ymd || '日付不明';
    return `${p.y}年${p.mo}月${p.d}日（${WEEK_JA[p.w]}）`;
  }
  const weekJa = ymd => { const p = parseYmd(ymd); return p ? WEEK_JA[p.w] : ''; };
  const weekEn = ymd => { const p = parseYmd(ymd); return p ? WEEK_EN[p.w] : ''; };
  const timeOf = dt => { const m = /(\d{2}):(\d{2})/.exec(dt || ''); return m ? m[1] + ':' + m[2] : ''; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // -------------------------------------------------------------
  // 状態
  // -------------------------------------------------------------
  let map;
  const fieldsMap = {};
  const markers = {};
  let allDates = [];                 // [{date, count}] 新しい順
  const state = {
    dates: new Set(),                // 空 = すべての撮影日
    type: ''                         // 空 = すべての種別（一覧のみ）
  };
  let currentTab = 'map';
  let galleryKey = null;

  const dateOk = p => state.dates.size === 0 || state.dates.has(p.date);
  const visiblePhotos = f => f.photos.filter(dateOk);

  // -------------------------------------------------------------
  // タブ切替
  // -------------------------------------------------------------
  function switchTab(name) {
    currentTab = name;
    document.getElementById('mapView').classList.toggle('active', name === 'map');
    document.getElementById('listView').classList.toggle('active', name === 'list');
    document.getElementById('tabMapBtn').classList.toggle('on', name === 'map');
    document.getElementById('tabListBtn').classList.toggle('on', name === 'list');
    if (name === 'map' && map) setTimeout(() => map.invalidateSize(), 50);
  }

  function initMap() {
    map = L.map('map').setView([CONFIG.DEFAULT_LAT, CONFIG.DEFAULT_LNG], 14);
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    });
    const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
      maxZoom: 19
    });
    esriSat.addTo(map); // ベースは衛星写真
    L.control.layers({ "衛星写真": esriSat, "標準地図": osmLayer }, null, { position: 'topright' }).addTo(map);
    loadData();
  }

  async function loadData() {
    try {
      const res = await fetch(CONFIG.FIELD_JSON_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const records = Array.isArray(data) ? data : (data.records || []);
      buildFieldsMap(records);
      buildDates();
      renderPins();
      renderDateChips();
      renderTypeChips();
      applyFilter(false);
    } catch (e) {
      console.warn('データの読み込みに失敗しました:', e);
      document.getElementById('legend').innerHTML =
        '<span style="color:var(--accent);">データを読み込めませんでした（json/photo_field_joined.json を確認してください）。</span>';
    }
  }

  function buildFieldsMap(records) {
    records.forEach(r => {
      const key = r['圃場キー'];
      if (!key) return;
      if (!fieldsMap[key]) {
        fieldsMap[key] = {
          key, name: r['圃場名'] || key, lat: null, lng: null,
          variety: r['作付計画_品種'] || null, staff: r['担当者'] || null, address: r['住所'] || null,
          photos: []
        };
      }
      const f = fieldsMap[key];
      if (r.latitude != null && r.longitude != null) { f.lat = r.latitude; f.lng = r.longitude; }
      if (!f.variety && r['作付計画_品種']) f.variety = r['作付計画_品種'];
      if (!f.staff && r['担当者']) f.staff = r['担当者'];
      if ((!f.name || f.name === key) && r['圃場名']) f.name = r['圃場名'];
      if (r['画像ファイル名']) {
        const dt = r['撮影日時'] || '';
        f.photos.push({
          type: r['撮影種別'],
          filename: r['画像ファイル名'],
          datetime: dt,
          date: r['日付'] || dt.slice(0, 10),
          recorder: r['記録者']
        });
      }
    });
  }

  function buildDates() {
    const cnt = {};
    Object.values(fieldsMap).forEach(f => f.photos.forEach(p => { cnt[p.date] = (cnt[p.date] || 0) + 1; }));
    allDates = Object.keys(cnt).sort().reverse().map(date => ({ date, count: cnt[date] }));
    multiYear = new Set(allDates.map(d => d.date.slice(0, 4))).size > 1;
  }

  // -------------------------------------------------------------
  // 撮影日フィルタ（複数選択チップ）
  // -------------------------------------------------------------
  function renderDateChips() {
    const box = document.getElementById('dateChips');
    const allOn = state.dates.size === 0;
    const total = allDates.reduce((s, d) => s + d.count, 0);
    box.innerHTML =
      `<button type="button" class="chip all${allOn ? ' on' : ''}" data-date="" aria-pressed="${allOn}">すべて<span class="n">${total}</span></button>` +
      allDates.map(d => {
        const on = state.dates.has(d.date);
        return `<button type="button" class="chip${on ? ' on' : ''}" data-date="${esc(d.date)}" aria-pressed="${on}" title="${esc(fmtLong(d.date))}">` +
               `${esc(fmtShort(d.date))}<span class="w">${esc(weekJa(d.date))}</span><span class="n">${d.count}</span></button>`;
      }).join('');
    box.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => toggleDate(btn.dataset.date)));
  }

  function toggleDate(date) {
    if (!date) state.dates.clear();
    else if (state.dates.has(date)) state.dates.delete(date);
    else state.dates.add(date);
    if (state.dates.size === allDates.length) state.dates.clear(); // 全日選択 = すべて
    renderDateChips();
    applyFilter(true);
  }

  function applyFilter(refit) {
    updateMarkers(refit);
    renderTypeChips();
    renderList();
    updateSummary();
    if (galleryKey) openGallery(galleryKey);
  }

  function updateSummary() {
    let photos = 0, fields = 0;
    Object.values(fieldsMap).forEach(f => { const n = visiblePhotos(f).length; photos += n; if (n) fields++; });
    document.getElementById('summary').innerHTML = `<b>${photos}</b> 枚 ・ <b>${fields}</b> 圃場`;
  }

  // -------------------------------------------------------------
  // 地図ピン
  // -------------------------------------------------------------
  function renderPins() {
    Object.values(fieldsMap).forEach(f => {
      if (f.lat == null || f.lng == null) return;
      const marker = L.circleMarker([f.lat, f.lng], { radius: 8, color: '#ffffff', weight: 2, fillColor: colorForVariety(f.variety), fillOpacity: 0.9 }).addTo(map);
      marker.bindPopup('', { autoPan: true, closeButton: true, maxWidth: 260 });
      markers[f.key] = marker;
    });
    const pts = Object.values(fieldsMap).filter(f => f.lat != null).map(f => [f.lat, f.lng]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15));
  }

  function updateMarkers(refit) {
    const pts = [];
    const activeVarieties = new Set();
    Object.values(fieldsMap).forEach(f => {
      const m = markers[f.key];
      if (!m) return;
      const n = visiblePhotos(f).length;
      if (n > 0) {
        m.setStyle({ radius: 8, color: '#ffffff', weight: 2, fillColor: colorForVariety(f.variety), fillOpacity: 0.95, opacity: 1 });
        m.bringToFront();
        pts.push([f.lat, f.lng]);
        activeVarieties.add(f.variety || '未設定');
      } else {
        // 選択中の撮影日に写真がない圃場は薄く表示（位置関係は残す）
        m.setStyle({ radius: 5, color: '#ffffff', weight: 1, fillColor: '#7a8fae', fillOpacity: 0.35, opacity: 0.6 });
      }
      m.setPopupContent(buildPopupContent(f));
    });
    buildLegend(activeVarieties);
    if (refit && pts.length && state.dates.size > 0) map.fitBounds(L.latLngBounds(pts).pad(0.2), { maxZoom: 17 });
    else if (refit && state.dates.size === 0) {
      const all = Object.values(fieldsMap).filter(f => f.lat != null).map(f => [f.lat, f.lng]);
      if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.15));
    }
  }

  function buildPopupContent(f) {
    const div = document.createElement('div');
    div.className = 'pop';
    const dates = [...new Set(f.photos.map(p => p.date))].sort().reverse();
    const vis = visiblePhotos(f);
    div.innerHTML =
      `<div class="eyebrow">Field</div><div class="t">${esc(f.name)}</div>` +
      `<dl><dt>品種</dt><dd>${esc(f.variety || '未設定')}</dd><dt>担当</dt><dd>${esc(f.staff || '未設定')}</dd></dl>` +
      `<div class="eyebrow" style="margin-bottom:4px">撮影日</div>` +
      `<div class="dates">${dates.map(d => `<span class="pill${(state.dates.size === 0 || state.dates.has(d)) ? ' on' : ''}">${esc(fmtShort(d))} ${esc(weekJa(d))}</span>`).join('')}</div>`;
    if (vis.length > 0) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn';
      btn.textContent = `写真を見る（${vis.length}枚）`;
      btn.addEventListener('click', () => openGallery(f.key));
      div.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn ghost';
      btn.textContent = `全撮影日の写真を見る（${f.photos.length}枚）`;
      btn.addEventListener('click', () => { state.dates.clear(); renderDateChips(); applyFilter(false); openGallery(f.key); });
      const note = document.createElement('div');
      note.className = 'none';
      note.style.marginBottom = '8px';
      note.textContent = '選択中の撮影日の写真はありません';
      div.appendChild(note);
      div.appendChild(btn);
    }
    return div;
  }

  function buildLegend(active) {
    const legend = document.getElementById('legend');
    legend.innerHTML = Object.keys(varietyColors).map(v =>
      `<div class="legend-item${active.has(v) ? '' : ' dim'}"><span class="legend-dot" style="background:${varietyColors[v]}"></span>${esc(v)}</div>`
    ).join('');
  }

  // -------------------------------------------------------------
  // 写真カード・撮影日ごとのセクション（一覧・圃場ギャラリー共通）
  // -------------------------------------------------------------
  function groupByDate(items) {        // items: [{field, photo}]
    const g = {};
    items.forEach(it => { (g[it.photo.date] = g[it.photo.date] || []).push(it); });
    return Object.keys(g).sort().reverse().map(date => ({ date, items: g[date] }));
  }

  function renderSections(container, items, opts) {
    container.innerHTML = '';
    if (!items.length) {
      container.innerHTML = '<div class="empty">選択した条件に該当する写真はありません。</div>';
      return;
    }
    const groups = groupByDate(items);
    const flat = [];                     // ライトボックスの前後送り順（表示順と同じ）
    groups.forEach(g => g.items.forEach(it => flat.push(it)));
    let idx = 0;
    groups.forEach(g => {
      const sec = document.createElement('section');
      sec.className = 'dsec';
      sec.innerHTML =
        `<div class="dsec-h"><div><div class="eyebrow">${esc(g.date.slice(0, 4))} · ${esc(weekEn(g.date))}</div>` +
        `<div class="d">${esc(fmtLong(g.date).replace(/^\d+年/, ''))}</div></div>` +
        `<div class="c">${g.items.length} 枚</div></div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      g.items.forEach(it => {
        const i = idx++;
        const { field, photo } = it;
        const card = document.createElement('div');
        card.className = 'card';
        const title = opts.titleIsType ? typeLabel(photo.type) : field.name;
        const meta = [];
        if (!opts.titleIsType && !state.type) meta.push(`<span class="ty">${esc(typeLabel(photo.type))}</span>`);
        meta.push(esc(timeOf(photo.datetime)));
        if (!opts.titleIsType && field.lat == null) meta.push('位置情報なし');
        card.innerHTML =
          `<img src="${esc(CONFIG.IMG_DIR + photo.filename)}" loading="lazy" alt="${esc(title)}" data-type="${esc(photo.type)}">` +
          `<span class="dbadge">${esc(fmtShort(photo.date))}</span>` +
          `<div class="info"><div class="fn">${esc(title)}</div><div class="meta">${meta.join(' ・ ')}</div></div>`;
        card.addEventListener('click', () => opts.onClick(flat, i));
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      container.appendChild(sec);
    });
  }

  // -------------------------------------------------------------
  // 圃場ピン → 圃場の写真（撮影日ごと）
  // -------------------------------------------------------------
  function openGallery(key) {
    const f = fieldsMap[key];
    if (!f) return;
    galleryKey = key;
    const vis = visiblePhotos(f);
    const items = vis.map(p => ({ field: f, photo: p }))
      .sort((a, b) => typeRank(a.photo.type) - typeRank(b.photo.type) || a.photo.datetime.localeCompare(b.photo.datetime));
    document.getElementById('galleryTitle').textContent = f.name;
    const dates = [...new Set(vis.map(p => p.date))];
    document.getElementById('gallerySub').textContent =
      `${vis.length} 枚 ・ 撮影日 ${dates.length} 日` + (state.dates.size ? '（撮影日で絞り込み中）' : '');
    renderSections(document.getElementById('galleryBody'), items, {
      titleIsType: true,
      onClick: (flat, i) => openLightbox(flat, i)
    });
    document.getElementById('galleryModal').style.display = 'flex';
  }
  function closeGallery() {
    galleryKey = null;
    document.getElementById('galleryModal').style.display = 'none';
  }

  // -------------------------------------------------------------
  // ライトボックス（拡大表示・前後送り）
  // -------------------------------------------------------------
  let lbItems = [];
  let lbIndex = 0;
  function openLightbox(items, idx) {
    lbItems = items; lbIndex = idx;
    renderLightbox();
    document.getElementById('lightbox').style.display = 'flex';
  }
  function renderLightbox() {
    const { field, photo } = lbItems[lbIndex];
    document.getElementById('lightboxImg').src = CONFIG.IMG_DIR + photo.filename;
    document.getElementById('lightboxCaption').innerHTML =
      `<span class="d">${esc(fmtLong(photo.date))} ${esc(timeOf(photo.datetime))}</span><br>` +
      `<span class="f">${esc(field.name)}</span><span class="ty">${esc(typeLabel(photo.type))}</span>` +
      `<span class="cnt">${lbIndex + 1} / ${lbItems.length}</span>`;
    const multi = lbItems.length > 1;
    document.getElementById('lightboxPrev').style.visibility = multi ? 'visible' : 'hidden';
    document.getElementById('lightboxNext').style.visibility = multi ? 'visible' : 'hidden';
  }
  function lightboxPrev() { lbIndex = (lbIndex - 1 + lbItems.length) % lbItems.length; renderLightbox(); }
  function lightboxNext() { lbIndex = (lbIndex + 1) % lbItems.length; renderLightbox(); }
  function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

  // -------------------------------------------------------------
  // 一覧：撮影種別（単一選択）× 撮影日 → 撮影日ごとのセクション
  // -------------------------------------------------------------
  function renderTypeChips() {
    const box = document.getElementById('typeChips');
    const cnt = {};
    let total = 0;
    Object.values(fieldsMap).forEach(f => visiblePhotos(f).forEach(p => { cnt[p.type] = (cnt[p.type] || 0) + 1; total++; }));
    const types = [...TYPE_ORDER, ...Object.keys(cnt).filter(t => !TYPE_ORDER.includes(t))];
    const chip = (t, label, n) => {
      const on = state.type === t;
      return `<button type="button" class="chip radio${on ? ' on' : ''}" role="radio" aria-checked="${on}" data-type="${esc(t)}"${n === 0 && !on ? ' style="opacity:.45"' : ''}>${esc(label)}<span class="n">${n}</span></button>`;
    };
    box.innerHTML = chip('', 'すべて', total) + types.map(t => chip(t, typeLabel(t), cnt[t] || 0)).join('');
    box.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
      state.type = b.dataset.type;
      renderTypeChips();
      renderList();
    }));
  }

  function renderList() {
    const items = [];
    Object.values(fieldsMap).forEach(f => visiblePhotos(f).forEach(p => {
      if (!state.type || p.type === state.type) items.push({ field: f, photo: p });
    }));
    items.sort((a, b) =>
      (a.field.name || '').localeCompare(b.field.name || '', 'ja', { numeric: true }) ||
      typeRank(a.photo.type) - typeRank(b.photo.type) ||
      a.photo.datetime.localeCompare(b.photo.datetime));
    renderSections(document.getElementById('listBody'), items, {
      titleIsType: false,
      onClick: (flat, i) => selectListItem(flat, i)
    });
  }

  function selectListItem(flat, i) {
    openLightbox(flat, i);
    const field = flat[i].field;
    if (field.lat != null && field.lng != null) {
      switchTab('map');
      setTimeout(() => {
        map.setView([field.lat, field.lng], 17);
        const m = markers[field.key];
        if (m) m.openPopup();
      }, 60);
    }
  }

  // -------------------------------------------------------------
  // モーダル：背景クリック / Esc / ←→
  // -------------------------------------------------------------
  document.getElementById('galleryModal').addEventListener('click', e => { if (e.target.id === 'galleryModal') closeGallery(); });
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox' || e.target.classList.contains('lb')) closeLightbox(); });
  document.addEventListener('keydown', e => {
    const lbOpen = document.getElementById('lightbox').style.display === 'flex';
    if (e.key === 'Escape') { if (lbOpen) closeLightbox(); else closeGallery(); }
    if (lbOpen && e.key === 'ArrowLeft') lightboxPrev();
    if (lbOpen && e.key === 'ArrowRight') lightboxNext();
  });

  window.onload = initMap;
</script>
</body>
</html>
